name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build UberProfitApp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Signed Release APK
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          elif [ -n "$JAVA_HOME_21_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          cd android/app
          if [ ! -f release-keystore.jks ]; then
            keytool -genkeypair -v -keystore release-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias uberprofit -storepass uberprofit123 -keypass uberprofit123 -dname "CN=UberProfitAuto, OU=Mobile, O=UberProfit, L=SaoPaulo, ST=SP, C=BR"
          fi
          cd ..
          gradle assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -Dkotlin.incremental=false --no-daemon --stacktrace
          cd ..
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" UberProfitApp_V7_Android.apk
          ls -lh UberProfitApp_V7_Android.apk

      - name: Upload UberProfitApp.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberProfitApp-APK
          path: UberProfitApp_V7_Android.apk
          if-no-files-found: error
          retention-days: 30