name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build UberProfitApp Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Signing Keystore
        working-directory: android/app
        run: |
          if [ ! -f release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias uberprofit \
              -storepass uberprofit123 \
              -keypass uberprofit123 \
              -dname "CN=UberProfitAuto, OU=Mobile, O=UberProfit, L=SaoPaulo, ST=SP, C=BR"
          fi

      - name: Build Signed Release APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare UberProfitApp_V7_Android.apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: APK não encontrado!"
            exit 1
          fi
          cp "$APK_PATH" UberProfitApp_V7_Android.apk
          ls -lh UberProfitApp_V7_Android.apk

      - name: Upload UberProfitApp-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberProfitApp-APK
          path: UberProfitApp_V7_Android.apk
          if-no-files-found: error
          retention-days: 30
